<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CHUAI">
<title>CHUAI — экран для телефона</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#1C2B3A; --paper:#fff; --mist:#C9D4DE; --steel:#8FA3B5;
    --gold:#E8B84B; --red:#C4342B;
    --cn:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --ru:'Golos Text',-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0F1922;color:var(--paper);font-family:var(--cn);
       -webkit-text-size-adjust:100%;overflow:hidden}
  .screen{
    height:100vh; height:100dvh; max-width:520px; margin:0 auto;
    display:flex; flex-direction:column;
    background:linear-gradient(165deg,#1C2B3A 0%,#24384D 62%,#2A415A 100%);
    position:relative; overflow:hidden;
  }
  .bar{height:.8vh;min-height:6px;background:var(--red);flex:none}

  header{display:flex;align-items:center;justify-content:space-between;gap:8px;
         padding:1.6vh 5vw 0;flex:none}
  .logo{display:flex;align-items:center;gap:2.4vw}
  .logo svg.mark{width:3vh;height:3vh;flex:none}
  .logo .word{font-family:var(--ru);font-weight:800;font-size:2.3vh;letter-spacing:.07em}
  .logo .word b{color:var(--gold);font-weight:800}
  .langs{display:flex;gap:1vw;flex:none}
  .langs button{border:1px solid rgba(255,255,255,.24);background:transparent;color:var(--mist);
    font-family:var(--ru);font-weight:600;font-size:1.45vh;padding:0 2vw;min-height:3.6vh;
    border-radius:999px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .langs button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}

  .kicker{padding:1.4vh 5vw 0;font-size:1.5vh;font-weight:500;letter-spacing:.05em;color:var(--gold);flex:none}

  main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
       gap:1.8vh;padding:1.6vh 5vw 0}
  h1{font-weight:900;font-size:5vh;line-height:1.18}
  h1 em{font-style:normal;color:var(--gold)}
  .sub{font-size:1.95vh;line-height:1.5;color:var(--mist)}

  .num{background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.42);
       border-radius:1.6vh;padding:1.8vh 4vw;flex:none}
  .num .t{font-size:2.05vh;font-weight:700;line-height:1.4}
  .num .t b{color:var(--gold);font-weight:700}
  .num .s{font-size:1.8vh;color:var(--gold);font-weight:600;margin-top:.7vh;line-height:1.4}

  ul{list-style:none;display:flex;flex-direction:column;gap:1.2vh}
  li{display:flex;gap:2.4vw;align-items:flex-start;font-size:1.7vh;line-height:1.45;color:#DCE4EB}
  li i{font-style:normal;color:var(--gold);font-weight:700;flex:none}

  .mp{padding:0 5vw;flex:none}
  .mp-t{font-size:1.4vh;font-weight:600;letter-spacing:.04em;color:var(--steel);margin-bottom:1vh}
  .mp-row{display:flex;flex-wrap:wrap;gap:1.4vw}
  .mp-item{font-family:var(--ru);font-weight:800;font-size:1.35vh;letter-spacing:.02em;
           padding:.8vh 2vw;border-radius:.8vh;white-space:nowrap}
  .zap{background:#fff;color:var(--ink)}
  .ozon{background:#0069FF;color:#fff}
  .wb{background:linear-gradient(135deg,#CB11AB,#481173);color:#fff}
  .ya{background:#FFDB4D;color:#21201F}
  .mm{background:linear-gradient(135deg,#7B2BF9,#00C25A);color:#fff}

  footer{display:flex;align-items:center;gap:4vw;margin:1.8vh 4vw 2.4vh;
         background:#fff;border-radius:1.8vh;padding:2vh 4vw;flex:none}
  .qr{width:15vh;height:15vh;min-width:104px;min-height:104px;flex:none;color:var(--ink)}
  .qt{display:flex;flex-direction:column;gap:.7vh;color:var(--ink);min-width:0}
  .qt .big{font-weight:900;font-size:2vh;line-height:1.3}
  .qt .small{font-size:1.45vh;color:#5C6B7A;line-height:1.4}
  .qt .url{font-family:var(--ru);font-weight:800;font-size:2vh;color:var(--red);margin-top:.3vh}

  footer{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tap-hint{font-size:1.25vh;color:#8FA3B5;text-align:center;padding:0 5vw 1vh;flex:none}
  .qr-full{position:fixed;inset:0;background:#fff;z-index:60;display:none;
           flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:6vw}
  .qr-full.show{display:flex}
  .qr-full svg{width:min(78vw,52vh);height:min(78vw,52vh);color:#16232F}
  .qr-full .u{font-family:var(--ru);font-weight:800;font-size:4vh;color:#C4342B}
  .qr-full .c{font-weight:700;font-size:2.4vh;color:#16232F;text-align:center;line-height:1.35}
  .qr-full .x{position:absolute;top:2vh;right:5vw;font-size:3.4vh;color:#8FA3B5;line-height:1}

  html[lang="ja"] body{font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif}
  html[lang="ko"] body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
  html[lang="hi"] body{font-family:'Kohinoor Devanagari','Noto Sans Devanagari','Nirmala UI',sans-serif}
  html[lang="en"] body{font-family:var(--ru)}

  /* на широком экране (проверка с компьютера) не растягиваем текст */
  @media (min-width:560px){
    h1{font-size:42px} .sub{font-size:17px} .num .t{font-size:18px} .num .s{font-size:15.5px}
    li{font-size:15px} .mp-item{font-size:12px} .qt .big{font-size:18px} .qr{width:116px;height:116px}
    .langs button{font-size:13px;min-height:32px;padding:0 11px}
    .kicker{font-size:13px} .logo .word{font-size:20px}
  }
</style>
</head>
